[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "programmatic-labeling-spam"
version = "1.0.0"
description = "Train a spam classifier without hand labels: labeling functions + an EM label model."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Neria Fay Arinda" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
weak-label = "weaklabel.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
